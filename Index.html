
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PuntoMax POS</title>
<style>
body{font-family:Arial;background:#f1f4f8;margin:0;color:#172b45}
header{background:#102b50;color:white;padding:20px}
main{padding:16px;max-width:900px;margin:auto}
section{background:white;padding:16px;border-radius:12px;margin-bottom:15px}
input{width:100%;padding:12px;box-sizing:border-box;margin:8px 0;border:1px solid #ccc;border-radius:7px}
button{padding:12px;border:0;border-radius:7px;background:#1762a8;color:white;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.product{background:#f4f7fb;color:#172b45;border:1px solid #ddd;text-align:left}
.product b{display:block;margin-bottom:8px}
.item{padding:9px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:8px}
.total{font-size:24px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>PuntoMax POS</h1>
<p>Sistema de punto de venta</p>
</header>
<main>
<section>
<h2>Buscar productos</h2>
<input id="search" placeholder="Nombre o código de barras">
<div id="products" class="products"></div>
</section>
<section>
<h2>Venta actual</h2>
<div id="cart">No hay productos agregados.</div>
<p class="total">Total: $<span id="total">0.00</span></p>
<label>Forma de pago</label>
<select id="payment">
<option>Efectivo</option>
<option>Tarjeta</option>
<option>Transferencia</option>
</select>
<div id="cash">
<input id="received" type="number" placeholder="Efectivo recibido">
<p>Cambio: $<span id="change">0.00</span></p>
</div>
<button onclick="finishSale()">Registrar venta</button>
<button onclick="clearCart()" style="background:#a33">Cancelar</button>
<p id="message"></p>
</section>
<section>
<h2>Resumen de ventas</h2>
<p>Ventas realizadas: <b id="count">0</b></p>
<p>Total vendido: <b id="sold">$0.00</b></p>
</section>
</main>
<script>
const catalog=[
{code:"7501001",name:"Arroz 1 kg",price:28},
{code:"7501002",name:"Frijol 1 kg",price:35},
{code:"7501003",name:"Azúcar 1 kg",price:29},
{code:"7501004",name:"Aceite 1 litro",price:42},
{code:"7501005",name:"Leche 1 litro",price:27},
{code:"7501006",name:"Refresco 2 litros",price:38},
{code:"7501007",name:"Galletas",price:18},
{code:"7501008",name:"Detergente",price:32}
];
let cart=[];
let sales=JSON.parse(localStorage.getItem("pm_sales")||"[]");
const money=n=>n.toFixed(2);
function renderProducts(){
let q=document.getElementById("search").value.toLowerCase();
let found=catalog.filter(p=>p.name.toLowerCase().includes(q)||p.code.includes(q));
document.getElementById("products").innerHTML=found.map(p=>
`<button class="product" onclick="add('${p.code}')"><b>${p.name}</b>$${money(p.price)}<br><small>${p.code}</small></button>`
).join("")||"No se encontraron productos.";
}
function add(code){
let p=catalog.find(x=>x.code===code);
let item=cart.find(x=>x.code===code);
if(item)item.qty++;
else cart.push({...p,qty:1});
renderCart();
}
function renderCart(){
let el=document.getElementById("cart");
el.innerHTML=cart.length?cart.map(p=>
`<div class="item"><span>${p.name}<br><small>${p.qty} x $${money(p.price)}</small></span><b>$${money(p.qty*p.price)}</b><button onclick="removeItem('${p.code}')">X</button></div>`
).join(""):"No hay productos agregados.";
let total=cart.reduce((s,p)=>s+p.price*p.qty,0);
document.getElementById("total").textContent=money(total);
changeAmount();
}
function removeItem(code){cart=cart.filter(p=>p.code!==code);renderCart();}
function clearCart(){cart=[];renderCart();document.getElementById("message").textContent="Venta cancelada.";}
function changeAmount(){
let total=cart.reduce((s,p)=>s+p.price*p.qty,0);
let received=Number(document.getElementById("received").value)||0;
document.getElementById("change").textContent=money(Math.max(0,received-total));
}
document.getElementById("received").addEventListener("input",changeAmount);
document.getElementById("payment").addEventListener("change",e=>{
document.getElementById("cash").style.display=e.target.value==="Efectivo"?"block":"none";
});
function finishSale(){
let total=cart.reduce((s,p)=>s+p.price*p.qty,0);
if(!cart.length){alert("Agrega productos primero.");return;}
let payment=document.getElementById("payment").value;
let received=Number(document.getElementById("received").value)||0;
if(payment==="Efectivo"&&received<total){alert("El efectivo recibido no alcanza.");return;}
let sale={date:new Date().toLocaleString(),total,payment};
sales.push(sale);
localStorage.setItem("pm_sales",JSON.stringify(sales));
document.getElementById("message").textContent="Venta registrada correctamente.";
cart=[];
document.getElementById("received").value="";
renderCart();
renderSummary();
}
function renderSummary(){
document.getElementById("count").textContent=sales.length;
document.getElementById("sold").textContent="$"+money(sales.reduce((s,x)=>s+x.total,0));
}
renderProducts();
renderCart();
renderSummary();
document.getElementById("search").addEventListener("input",renderProducts);
document.getElementById("search").addEventListener("keydown",e=>{
if(e.key==="Enter"){
let p=catalog.find(x=>x.code===e.target.value.trim());
if(p){add(p.code);e.target.value="";renderProducts();}
}
});
</script>
</body>
</html>
